# Snowflake MCP Server Configuration
# Minimal configuration - customize as needed
# Set Create/Drop to true in sql_statement_permissions to expose create_object, drop_object, create_or_alter_object.

agent_services: []
search_services: []
analyst_services: []

other_services:
  object_manager: true
  query_manager: true
  semantic_manager: true

sql_statement_permissions:  # Create/Drop false = read-only object manager (describe_object, list_objects only)
  - Alter: false
  - Command: false
  - Comment: true
  - Commit: false
  - Create: false
  - Delete: false
  - Describe: true
  - Drop: false
  - Insert: false
  - Merge: false
  - Rollback: false
  - Select: true
  - Transaction: false
  - TruncateTable: false
  - Unknown: false
  - Update: false
  - Use: true
